<!-- PAGE HEADER -->

<section class="page-header">

    <h1>Checkout</h1>

    <p>Complete your order details below.</p>

</section>

<!-- CHECKOUT -->

<section class="checkout-section">

    <div class="checkout-grid">

        <!-- CUSTOMER DETAILS -->

        <div class="checkout-form">

            <h2>Customer Information</h2>

            <form id="checkoutForm">

               <input
    type="text"
    id="customerName"
    placeholder="Full Name"
    required>

<input
    type="tel"
    id="customerPhone"
    placeholder="Phone Number"
    required>

<input
    type="email"
    id="customerEmail"
    placeholder="Email Address">

<textarea
    id="customerAddress"
    placeholder="Delivery Address"
    rows="5"
    required></textarea>

<select id="customerRegion" required>

    <option value="">Select Region</option>

    <option>Greater Accra</option>
    <option>Ashanti</option>
    <option>Central</option>
    <option>Eastern</option>
    <option>Western</option>
    <option>Volta</option>
    <option>Northern</option>

</select>

<select id="paymentMethod" required>

    <option value="">Payment Method</option>

    <option>Mobile Money</option>
    <option>Cash on Delivery</option>
    <option>Bank Transfer</option>

</select>

            </form>

        </div>

        <!-- ORDER SUMMARY -->

        <div class="order-summary">

            <h2>Order Summary</h2>

            <div id="checkout-items">

            </div>

            <div class="summary-total">

                <h3>

                    Total

                    <span id="checkout-total">

                        GH₵0

                    </span>

                </h3>

            </div>
<button
    type="button"
    id="placeOrder"
    class="primary-btn place-order">

    Place Order

</button>

        </div>

    </div>

</section>
<!-- =========================
     TOAST NOTIFICATION
========================== -->

<div id="toast" class="toast">

    <i class="fas fa-check-circle"></i>

    <span id="toast-message">

        Product added successfully!

    </span>

</div>

<script src="js/main.js"></script>

     ORDER CONFIRMATION MODAL
========================== -->

<div id="orderModal" class="order-modal">

    <div class="order-modal-content">

        <i class="fas fa-circle-check"></i>

        <h2>WhatsApp Opened</h2>

        <p>

            After sending your order on WhatsApp,
            click the button below.

        </p>

        <button id="orderSent" class="primary-btn">

            I Have Sent My Order

        </button>

    </div>

</div>
